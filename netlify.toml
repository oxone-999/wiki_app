# Netlify config for the frontend (client/).
# In Netlify site settings set an env var:  VITE_API_BASE = https://<your-render-app>.onrender.com

[build]
  base = "client"
  command = "npm run build"
  publish = "client/dist"

# SPA fallback so React Router routes (/wiki, /gallery, /admin) work on reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
